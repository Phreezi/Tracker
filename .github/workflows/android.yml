name: Build Android APK

on:
  push:
    branches: [ "**" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar o APK num Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" foi removido pela Google e faz a action
          # falhar por omissão; instalamos só o que o projeto precisa (SDK 34).
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK (release, assinado com chave de debug)
        env:
          # Palavra-passe da conta tracker@sipfa.local, embutida no APK para o
          # telemóvel só precisar de um nome. Definir em Settings → Secrets.
          TRACKER_ACCOUNT_PASSWORD: ${{ secrets.TRACKER_ACCOUNT_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publica o APK num Release (prerelease "apk-latest", sempre atualizado)
      # para ficar fácil de descarregar na página de Releases do repositório.
      - name: Publicar APK no Release "apk-latest"
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK mais recente
          prerelease: true
          files: android/app/build/outputs/apk/release/*.apk
          body: |
            APK do Tracker compilado automaticamente a partir do último build.
            Assinado com a chave de *debug* (uso pessoal). Descarrega o
            `app-release.apk` abaixo e instala no telemóvel.
