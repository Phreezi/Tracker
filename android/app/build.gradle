plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pt.familia.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "pt.familia.tracker"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.3"

        // Palavra-passe da conta tracker@sipfa.local embutida no build — assim o
        // telemóvel só precisa de um NOME. Vem do secret do GitHub
        // TRACKER_ACCOUNT_PASSWORD (ou -PtrackerPassword=… no PC); nunca do
        // código. Escapa \ e " para ficar um literal Java válido.
        def _pw = (project.findProperty('trackerPassword')
                    ?: System.getenv('TRACKER_ACCOUNT_PASSWORD') ?: '')
                    .toString().replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField "String", "ACCOUNT_PASSWORD", "\"${_pw}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // APK de depuração/uso pessoal; assinada com a chave de debug no CI.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
